name: Test
on:
  pull_request:
  push:
    branches:
      - main
      - 'renovate/*'

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
  tests:
    name: tests / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Renovate never rebuilds `dist/`, so same-repo Renovate changes skip
      # the freshness check; the sync-dist workflow repairs main after merge.
      - name: Compare expected and actual dist
        if: >-
          ${{
            (
              github.event_name == 'pull_request' &&
              (
                github.event.pull_request.user.login != 'renovate[bot]' ||
                github.event.pull_request.head.repo.full_name != github.repository ||
                !startsWith(github.head_ref, 'renovate/')
              )
            ) ||
            (
              github.event_name == 'push' &&
              !startsWith(github.ref_name, 'renovate/')
            )
          }}
        run: git diff --exit-code -- dist/
      - name: Apply Renovate dist exemption
        if: >-
          ${{
            (
              github.event_name == 'pull_request' &&
              github.event.pull_request.user.login == 'renovate[bot]' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              startsWith(github.head_ref, 'renovate/')
            ) ||
            (
              github.event_name == 'push' &&
              startsWith(github.ref_name, 'renovate/')
            )
          }}
        run: echo "Renovate changes are rebuilt by the sync-dist workflow after merge."
  required-checks-pass:
    name: Required checks pass
    if: always()
    needs: [lint, tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
